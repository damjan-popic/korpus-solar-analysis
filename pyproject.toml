[project]
name = "solar3-lexical-analysis"
version = "0.1.0"
description = "Šolar 3.0 CLASSLA reannotation and lexical analysis pipeline"
requires-python = ">=3.9"
dependencies = [
  "classla>=2.1",
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "tabulate>=0.9",
  "statsmodels>=0.14"
]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
